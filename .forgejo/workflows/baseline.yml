# H2 baseline security gate — SEEDED into each tti repo's .forgejo/workflows/.
#
# CANONICAL SOURCE: security/baseline/baseline.yml in forgejo-stack. Do NOT edit
# the seeded copy in a repo — the conformance audit (security/audit-baseline.sh)
# treats this file as the source of truth and re-seeds drift. There is no central
# reusable-workflow repo by design (Area H decision 1): the logic is self-contained
# and seeded, so there's no public CI repo and no org-wide `secrets: inherit` target.
#
# Runs on the A1 Ubuntu runner (runs-on: ubuntu-latest; ported 2026-07-03 — the
# original `runs-on: host` label retired with the host runner, which left seeded
# gates queued forever). Kept dependency-light on purpose (wget + tar + awk +
# git; manual checkout): the gate stays valid even on a minimal runner image.
#   - SCA + secrets gate here (fails the PR on HIGH/CRITICAL or a leaked secret).
#   - Semgrep SAST is report-only (K Phase 1) — findings print; the step FAILS
#     on errors[] PartialParsing (a coverage gap that looks like a pass).
#   - SBOM → Dependency-Track is a HOST-SIDE detective job (security/sbom-to-dtrack.sh),
#     NOT in this gate.
#
# Suppressions: a repo's .security-ignore (unified VEX-style allowlist) is compiled
# to each scanner's native ignore file at runtime; expired entries re-surface.
name: baseline-security
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      # Manual checkout — actions/checkout is JS and needs node, which the v9
      # runner image lacks. Same pattern as seed/tti-ux/.forgejo/workflows/scan.yml.
      - name: Manual checkout
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          JOB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init -q
          # Authenticate the fetch with the auto per-job token so this works on
          # PRIVATE repos too. An unauthenticated fetch of a private repo prompts
          # for a username and dies non-interactively ("could not read Username
          # for host.containers.internal" — hit live 2026-07-06 on the first
          # private repos). Header via -c (not the URL) so the token never lands
          # in remote config; the expansion line is unechoed.
          # Values reach the shell through env:, never expression-interpolated
          # into run: (same RCE class as ai-review.yml — textual substitution).
          git remote add origin "$SERVER_URL/$REPO"
          hdr="Authorization: basic $(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$hdr" fetch --depth=1 origin "$HEAD_SHA"
          git checkout -q FETCH_HEAD

      # Compile the unified .security-ignore into per-tool native ignore files.
      # Format per non-comment line:
      #   <tool>  <id-or-fingerprint>  <reason...>  [expires=YYYY-MM-DD]
      # Expired (or malformed) lines do NOT suppress — the finding re-surfaces.
      - name: Compile suppressions
        run: |
          set -eu
          TODAY=$(date +%Y-%m-%d)
          : > /tmp/.trivyignore
          : > ./.gitleaksignore
          : > /tmp/.semgrep-exclude
          if [ -f .security-ignore ]; then
            awk -v today="$TODAY" '
              /^[[:space:]]*#/ || NF==0 { next }
              {
                # NB: "exp" is a reserved awk builtin — using it as a variable
                # is a hard syntax error (bit live 2026-07-22, first repo to
                # actually carry a .security-ignore).
                until=""
                for (i=1;i<=NF;i++) if ($i ~ /^expires=/) until=substr($i,9)
                if (until != "" && until < today) next
                if ($1=="trivy")    print $2 >> "/tmp/.trivyignore"
                if ($1=="gitleaks") print $2 >> "./.gitleaksignore"
                if ($1=="semgrep")  print $2 >> "/tmp/.semgrep-exclude"
              }' .security-ignore
            echo "Active suppressions: $(wc -l < /tmp/.trivyignore | tr -d ' ') trivy, $(wc -l < ./.gitleaksignore | tr -d ' ') gitleaks, $(wc -l < /tmp/.semgrep-exclude | tr -d ' ') semgrep (expired excluded)."
          fi

      - name: Install scanners (static Go binaries → ~/.local/bin, checksum-verified)
        run: |
          set -eux
          mkdir -p "$HOME/.local/bin"
          # Pins + publisher SHA-256 — see ops/provenance/{trivy,gitleaks}.md. Bump
          # in lockstep with the A1.0 runner-image and update the hashes here.
          TRIVY_VERSION=0.72.0
          GITLEAKS_VERSION=8.30.1
          case "$(uname -m)" in
            aarch64|arm64)
              TRIVY_ARCH=ARM64; GL_ARCH=arm64
              TRIVY_SHA=2ca2c023109c2db6b2b77366b6717291452d4531167377d95c79547f0c8e3467
              GITLEAKS_SHA=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            x86_64)
              TRIVY_ARCH=64bit; GL_ARCH=x64
              TRIVY_SHA=bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
              GITLEAKS_SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          # Download to a file, verify the published checksum, THEN extract. The
          # bare wget|tar pipe trusted TLS only — this closes that gap.
          # fetch = 3 attempts covering EVERY failure class (DNS, TLS,
          # conn-refused, HTTP) — a single silent wget death from github.com
          # redded a PR before any scanning ran (2026-08-12). A gate must not
          # fail on its own toolchain download when one retry would do.
          fetch() {
            for _i in 1 2 3; do
              if wget -qO "$2" -T 30 "$1"; then return 0; fi
              echo "download failed (attempt ${_i}/3): $1"
              sleep 5
            done
            echo "download failed after 3 attempts: $1"
            return 1
          }
          # Prefer the A1.0 runner image's BAKED trivy when it matches the pin
          # (checksum-verified at image build — same trust anchor, zero
          # network). github.com throttled the ~50MB tarball during a 13-repo
          # rollout on 2026-08-12: three retries, all dead. The download is
          # now only the drift fallback, e.g. mid-quarter pin bumps before an
          # image rebuild.
          if [ "$(trivy --version 2>/dev/null | head -n1)" = "Version: ${TRIVY_VERSION}" ]; then
            ln -sf "$(command -v trivy)" "$HOME/.local/bin/trivy"
            echo "using image-baked trivy ${TRIVY_VERSION} (no download)"
          else
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-${TRIVY_ARCH}.tar.gz" /tmp/trivy.tgz
            echo "${TRIVY_SHA}  /tmp/trivy.tgz" | sha256sum -c -
            tar -xzf /tmp/trivy.tgz -C "$HOME/.local/bin" trivy
          fi
          # Same baked-first policy for gitleaks (in the image since the
          # 2026-08-12 rebuild — the throttle moved to its tarball the moment
          # trivy stopped downloading). Version output is bare ("8.30.1") but
          # tolerate a v-prefix; any mismatch falls back to the fetch.
          gv="$(gitleaks version 2>/dev/null || true)"
          if [ "$gv" = "${GITLEAKS_VERSION}" ] || [ "$gv" = "v${GITLEAKS_VERSION}" ]; then
            ln -sf "$(command -v gitleaks)" "$HOME/.local/bin/gitleaks"
            echo "using image-baked gitleaks ${GITLEAKS_VERSION} (no download)"
          else
            fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz" /tmp/gitleaks.tgz
            echo "${GITLEAKS_SHA}  /tmp/gitleaks.tgz" | sha256sum -c -
            tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          fi

      # SCA gate — vulnerable dependencies only. `--scanners vuln` keeps roles clean:
      # Trivy owns SCA, gitleaks (below) owns secrets. (Trivy's default fs scan ALSO
      # does secrets+misconfig, which would double-report against gitleaks.) Fails on
      # HIGH/CRITICAL; suppressed CVEs come from /tmp/.trivyignore.
      #
      # M2 (ops/M-actionable-findings-design.md): a failing gate must NAME THE
      # FIX. On pull_request failures this posts ONE marker-deduped comment
      # mapping each finding to the open Renovate PR that fixes it (or the
      # lockfile command when none exists), and flags when the failure is
      # INHERITED from a red default branch (the deadlock that kept three
      # repos red for a week, 2026-08-12). Token via env:, never ${{ }} in run.
      - name: SCA — Trivy filesystem (HIGH/CRITICAL gate + fix map)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # --exit-code 0 means findings never fail this invocation (the
          # python below owns the verdict) — so a nonzero here is purely
          # operational (vulndb download flake and kin) and safe to retry.
          _ok=""
          for _try in 1 2 3; do
            if "$HOME/.local/bin/trivy" fs --scanners vuln --severity HIGH,CRITICAL \
              --exit-code 0 --no-progress --ignorefile /tmp/.trivyignore \
              --format json --output /tmp/trivy.json .; then _ok=1; break; fi
            echo "trivy attempt ${_try}/3 failed (operational — likely vulndb fetch); retrying in 10s"
            sleep 10
          done
          if [ -z "$_ok" ]; then echo "trivy could not complete after 3 attempts"; exit 1; fi
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request

          rep = json.load(open("/tmp/trivy.json"))
          vulns = []
          for res in rep.get("Results") or []:
              for v in res.get("Vulnerabilities") or []:
                  vulns.append({"target": res.get("Target", ""),
                                "pkg": v.get("PkgName", ""),
                                "id": v.get("VulnerabilityID", ""),
                                "sev": v.get("Severity", ""),
                                "installed": v.get("InstalledVersion", ""),
                                "fixed": v.get("FixedVersion", "")})
          if not vulns:
              print("SCA: no HIGH/CRITICAL findings.")
              sys.exit(0)
          print(f"SCA: {len(vulns)} HIGH/CRITICAL finding(s):")
          for v in vulns:
              print(f"  {v['sev']:9} {v['pkg']:30} {v['id']:20} "
                    f"{v['installed']} -> fixed in {v['fixed'] or '?'}  ({v['target']})")

          api = os.environ.get("GITHUB_API_URL", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          tok = os.environ.get("GH_TOKEN", "")

          def gh(path, data=None):
              req = urllib.request.Request(
                  api + path,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={"Authorization": "token " + tok,
                           "Content-Type": "application/json"},
                  method="POST" if data is not None else "GET")
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.load(r)

          if os.environ.get("GITHUB_EVENT_NAME") == "pull_request" and api and repo and tok:
              try:
                  event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
                  pr = event.get("pull_request") or {}
                  prn = event.get("number") or pr.get("number")
                  head_sha = (pr.get("head") or {}).get("sha", "")
                  base_ref = (pr.get("base") or {}).get("ref", "")
                  marker = f"<!-- tti-fixmap:{head_sha} -->"
                  cs = gh(f"/repos/{repo}/issues/{prn}/comments?limit=50")
                  if any(marker in (c.get("body") or "") for c in cs):
                      print("fix map already posted for this head commit.")
                      sys.exit(1)
                  prs = gh(f"/repos/{repo}/pulls?state=open&limit=50")

                  def fix_pr(pkg):
                      needle = pkg.lower().split("/")[-1]
                      for p in prs:
                          hay = (p.get("title", "") + " " +
                                 ((p.get("head") or {}).get("ref") or "")).lower()
                          if needle and needle in hay:
                              return p
                      return None

                  lines = ["### 🔧 Security-gate fix map", marker, "",
                           "The gate failed on these dependency findings — "
                           "fastest path to green for each:", "",
                           "| finding | package | installed → fixed | do this |",
                           "|---|---|---|---|"]
                  for v in vulns:
                      p = fix_pr(v["pkg"])
                      if p:
                          do = f"merge #{p['number']} — {p['title'][:60]}"
                      elif "package-lock" in v["target"]:
                          do = (f"no fix PR yet — `npm update "
                                f"{v['pkg'].split('/')[-1]} --package-lock-only`")
                      else:
                          do = "no fix PR yet — bump the pinned version"
                      lines.append(f"| {v['id']} ({v['sev']}) | `{v['pkg']}` | "
                                   f"{v['installed']} → {v['fixed'] or '?'} | {do} |")
                  try:
                      st = gh(f"/repos/{repo}/commits/{base_ref}/status")
                      if (st.get("state") or "") in ("failure", "error"):
                          lines += ["", f"> ⚠ `{base_ref}` is itself red right now — "
                                    "this PR likely **inherits** the backlog rather "
                                    f"than adding it. Fixing `{base_ref}` (rows above) "
                                    "unblocks every open PR at once."]
                  except Exception:
                      pass
                  lines += ["", "<sub>Posted once per head commit by the baseline "
                            "gate (M2). A Renovate PR that only touches a manifest "
                            "with no lockfile change is a broken pre-2026-08-06 "
                            "artifact — check its diff before merging.</sub>"]
                  gh(f"/repos/{repo}/issues/{prn}/comments", {"body": "\n".join(lines)})
                  print("fix map comment posted.")
              except SystemExit:
                  raise
              except Exception as e:
                  print(f"fix-map post failed (non-fatal): {e!r}")
          sys.exit(1)
          PYEOF

      # Secret gate — the checkout is depth-1, so this scans the WHOLE TREE as of
      # the branch head (not just the diff). gitleaks reads ./.gitleaksignore
      # (fingerprints) by default. A hit here is already-burned → secret-rotation
      # runbook (ops/secret-rotation-runbook.md), not just a code edit.
      # --verbose prints each finding (rule, file:line, fingerprint) with the
      # secret value redacted — without it a failure is an unactionable
      # "leaks found: N" (hit live 2026-08-12 on a stale Renovate branch).
      - name: Secrets — gitleaks (tree scan, redacted findings)
        run: |
          if ! "$HOME/.local/bin/gitleaks" detect --no-banner --redact --verbose --exit-code 1; then
            echo
            echo "gitleaks failed — redacted findings above (rule, file:line, fingerprint)."
            echo " * NEW secret in this change: it is already burned — rotate it per"
            echo "   ops/secret-rotation-runbook.md, then scrub the content."
            echo " * A finding you did NOT touch: stale branch. This depth-1 scan covers"
            echo "   the whole tree, so a branch cut before a scrub landed on the default"
            echo "   branch re-reports the old finding — update the branch from the"
            echo "   default branch and re-run."
            echo " * Commit-pinned .security-ignore fingerprints cannot match here (the"
            echo "   shallow commit changes every push) — fix the content instead."
            exit 1
          fi

      # Undefined-name gate (J1, added 2026-08-06). Catches what neither the
      # SCA nor the secret scanner can, and what `py_compile` structurally
      # cannot: a name used in a function body that does not exist.
      #
      # Why this exists: nis/forgejo-stack#27. `zip_longest` was used without
      # its import; the file compiled, the MODULE IMPORTED FINE (Python
      # resolves names in a function body at CALL time), CI went green, and
      # the gateway 500'd on every review in production. pyflakes finds it in
      # one line without importing or executing anything.
      #
      # Graduated on purpose: an undefined name is a runtime NameError with
      # essentially no false positives, so it BLOCKS. Everything else pyflakes
      # reports (unused imports, dead locals) is printed and does not fail —
      # a new gate must not break 13 repos on the day it lands.
      - name: Undefined names — pyflakes (blocks; other findings advisory)
        run: |
          set -eu
          # ONE universal wheel (py2.py3-none-any) — unlike trivy/gitleaks
          # there is no per-arch hash to keep in step. Publisher SHA-256 from
          # PyPI, see ops/provenance/pyflakes.md.
          PYFLAKES_VERSION=3.4.0
          PYFLAKES_SHA=f742a7dbd0d9cb9ea41e9a24a918996e8170c799fa528688d40dd582c8265f4f
          WHEEL="pyflakes-${PYFLAKES_VERSION}-py2.py3-none-any.whl"
          # Same 3-attempt fetch as the scanner step (separate shell, so the
          # helper is redefined) — no gate red on a one-off download blip.
          fetch() {
            for _i in 1 2 3; do
              if wget -qO "$2" -T 30 "$1"; then return 0; fi
              echo "download failed (attempt ${_i}/3): $1"
              sleep 5
            done
            echo "download failed after 3 attempts: $1"
            return 1
          }
          fetch "https://files.pythonhosted.org/packages/c2/2f/81d580a0fb83baeb066698975cb14a618bdbed7720678566f1b046a95fe8/${WHEEL}" "/tmp/${WHEEL}"
          echo "${PYFLAKES_SHA}  /tmp/${WHEEL}" | sha256sum -c -
          # NOT `pip install`. Ubuntu 24.04 marks its system Python
          # externally-managed (PEP 668), so pip refuses outright — verified
          # against the real runner image, where it failed and left pyflakes
          # unimportable. A wheel is a zip, and pyflakes is pure Python, so
          # putting the VERIFIED wheel on PYTHONPATH runs exactly the bytes we
          # checksummed: no install, no venv, no --break-system-packages, and
          # nothing mutated in the image.
          export PYTHONPATH="/tmp/${WHEEL}"

          # Vendored/generated trees are not ours to lint.
          find . -name '*.py' \
            -not -path './.git/*' -not -path './node_modules/*' \
            -not -path './.venv/*' -not -path './venv/*' \
            -not -path './backups/*' -not -path './site-packages/*' \
            > /tmp/pyfiles.txt
          if [ ! -s /tmp/pyfiles.txt ]; then
            echo "no Python files in this repo — nothing to check."
            exit 0
          fi
          echo "checking $(wc -l < /tmp/pyfiles.txt) Python file(s)"
          # xargs -0, NOT `$(cat …)`: a large repo blows past ARG_MAX (515 .py
          # files in nis/landscape today), and an unquoted expansion mangles
          # any path containing a space. Both failure modes are SILENT — they
          # produce output that looks like "no findings".
          # pyflakes exits 1 on ANY finding, so capture rather than gate on it.
          tr '\n' '\0' < /tmp/pyfiles.txt \
            | xargs -0 --no-run-if-empty python3 -m pyflakes > /tmp/pyflakes.txt 2>&1 || true
          if [ -s /tmp/pyflakes.txt ]; then
            echo "--- pyflakes findings (advisory unless listed below) ---"
            cat /tmp/pyflakes.txt
          fi
          # Blocking subset: undefined names, and files pyflakes could not
          # parse. A parse failure is NOT a pass — silence from a scanner
          # that could not read the file is the trap documented in CLAUDE.md.
          if grep -E "undefined name|invalid syntax|unexpected (EOF|indent)" /tmp/pyflakes.txt; then
            echo ""
            echo "FAIL: undefined name or unparseable file above."
            echo "An undefined name is a NameError waiting for the first call."
            exit 1
          fi
          echo "OK: no undefined names."

      # Workflow YAML must PARSE (added 2026-08-14). A malformed workflow does
      # not fail loudly — Forgejo just never runs it, or 500s on dispatch, so
      # the repo silently loses a gate. Hit live: a python heredoc left at
      # column 0 dedented out of its `run: |` block scalar and made the whole
      # file unparseable ("could not find expected ':'"); a regex-extract +
      # `bash -n` pre-check reported it clean because the regex stopped at the
      # dedent and validated a TRUNCATED script. Only a real parse catches it.
      - name: Workflow YAML parses (blocks)
        run: |
          set -eu
          python3 - <<'PYEOF'
          import glob, sys
          files = sorted(glob.glob(".forgejo/workflows/*.yml")
                         + glob.glob(".forgejo/workflows/*.yaml")
                         + glob.glob(".github/workflows/*.yml")
                         + glob.glob(".github/workflows/*.yaml"))
          if not files:
              print("no workflow files to check.")
              sys.exit(0)
          # A REAL parser or nothing. An earlier draft degraded to a heuristic
          # when pyyaml was absent, and the heuristic missed the very bug it was
          # written for: it accepted any dedented line containing a colon, so a
          # heredoc body starting `d = {"a": 1}` or `Host: example.com` passed —
          # and it still printed "all workflow files parse". A check that cannot
          # see its own target defect, while claiming coverage, is the trap this
          # repo keeps re-learning. python3-yaml is in the runner image.
          try:
              import yaml
          except ImportError:
              print("FAIL: no YAML parser available (python3-yaml / pyyaml).")
              print("Refusing to guess — a heuristic here reports 'parses' on")
              print("files that do not. Add python3-yaml to the runner image.")
              sys.exit(1)

          fail = 0
          for f in files:
              try:
                  doc = yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as e:
                  print(f"  FAIL {f}: {str(e).splitlines()[0]}"); fail = 1; continue
              if doc is None:
                  # Empty or fully commented out — a normal way to park a
                  # workflow. It parses; that is what this step checks.
                  print(f"  ok   {f}  (empty / commented out)"); continue
              if isinstance(doc, dict) and doc.get("jobs"):
                  print(f"  ok   {f}  jobs={list(doc['jobs'])}")
              else:
                  # Parses but is not a runnable workflow. Worth saying, not
                  # worth reddening every PR in the repo over.
                  print(f"  ok   {f}  (parses; declares no jobs)")
          if fail:
              print("")
              print("FAIL: a workflow file does not parse. Forgejo will not run it,")
              print("and nothing else in CI will tell you — the gate just vanishes.")
              sys.exit(1)
          print(f"OK: {len(files)} workflow file(s) parsed with pyyaml.")
          PYEOF

      # SAST (K Phase 1, 2026-08-13) — report-only on findings; FAILS on
      # errors[] PartialParsing. Semgrep's bash sub-parser chokes on ${{ }}
      # inside run:, so "0 findings" can mean "never analysed those lines".
      # Rules are TTI-authored and vendored (never p/<pack> — registry
      # configs fetch from semgrep.dev at scan time).
      - name: SAST — semgrep (report-only; fail on parse gaps)
        run: |
          set -eu
          SEMGREP_VERSION=1.172.0
          # Baked-first, same policy as trivy/gitleaks above: once the A1.0
          # runner image bakes semgrep, this step goes zero-download too.
          # Until then the checksum-verified wheel is the drift fallback.
          if [ "$(semgrep --version 2>/dev/null)" = "${SEMGREP_VERSION}" ]; then
            SEMGREP=semgrep
            echo "using image-baked semgrep ${SEMGREP_VERSION} (no download)"
          else
            case "$(uname -m)" in
              aarch64|arm64)
                WHL="semgrep-${SEMGREP_VERSION}-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-manylinux_2_34_aarch64.whl"
                SEMGREP_SHA=c881a305b965e594b88b15c2c6419b398e76e438ec61e60916c8b2effe927240
                SEMGREP_URL="https://files.pythonhosted.org/packages/1b/45/35488f2f609db23eed350ada093722484a6f8cb3b1eaf8ecfd54e2338521/${WHL}" ;;
              x86_64)
                WHL="semgrep-${SEMGREP_VERSION}-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-manylinux_2_34_x86_64.whl"
                SEMGREP_SHA=d8b94af4266a575287ad2cd844573743ab4fe58f6bfb6d9229327807937eade3
                SEMGREP_URL="https://files.pythonhosted.org/packages/84/a5/21624510b65271a673961a894af7511b5123d662e84c74c765560ea28b27/${WHL}" ;;
              *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
            esac
            fetch() {
              for _i in 1 2 3; do
                if wget -qO "$2" -T 30 "$1"; then return 0; fi
                echo "download failed (attempt ${_i}/3): $1"
                sleep 5
              done
              echo "download failed after 3 attempts: $1"
              return 1
            }
            fetch "$SEMGREP_URL" "/tmp/${WHL}"
            echo "${SEMGREP_SHA}  /tmp/${WHL}" | sha256sum -c -
            # --target avoids PEP 668. Transitive deps still come from PyPI;
            # the engine wheel is the trust anchor (ops/provenance/semgrep.md).
            pip3 install --target /tmp/semgrep --no-compile --disable-pip-version-check \
              --no-warn-script-location "/tmp/${WHL}"
            export PYTHONPATH="/tmp/semgrep${PYTHONPATH:+:$PYTHONPATH}"
            # BOTH exports are load-bearing: the console script needs
            # PYTHONPATH for the package, and the OCaml core execvp's
            # `pysemgrep` from PATH. `python3 -m semgrep` is a HARD ERROR
            # (exit 2, empty output) in 1.172.0 — validated live 2026-08-13.
            export PATH="/tmp/semgrep/bin:$PATH"
            SEMGREP=semgrep
          fi
          # The SEEDED path wins on purpose: audit-baseline.sh hashes
          # .forgejo/semgrep-rules/tti.yml, so preferring a repo-local
          # security/semgrep-rules/ would let any repo swap out the audited
          # org pack while the audit still prints "ok".
          if [ -d .forgejo/semgrep-rules ]; then
            RULES=.forgejo/semgrep-rules
          elif [ -d security/semgrep-rules ]; then
            RULES=security/semgrep-rules
          else
            echo "FAIL: no vendored semgrep rules (security/semgrep-rules or .forgejo/semgrep-rules)."
            echo "The gate must not fetch p/ registry configs."
            exit 1
          fi
          EXCL=()
          if [ -s /tmp/.semgrep-exclude ]; then
            while IFS= read -r _id; do
              [ -n "$_id" ] && EXCL+=(--exclude-rule "$_id")
            done < /tmp/.semgrep-exclude
          fi
          $SEMGREP --metrics=off --disable-version-check \
            --config "$RULES" --json --quiet \
            --exclude .git --exclude node_modules --exclude .venv \
            --exclude venv --exclude backups --exclude site-packages \
            "${EXCL[@]+"${EXCL[@]}"}" \
            . > /tmp/semgrep.json || true
          python3 - <<'PYEOF'
          import json, sys
          try:
              rep = json.load(open("/tmp/semgrep.json"))
          except Exception as e:
              print(f"FAIL: could not parse semgrep JSON: {e}")
              sys.exit(1)
          errors = rep.get("errors") or []
          results = rep.get("results") or []
          parse_gaps = [e for e in errors
                        if "PartialParsing" in str(e.get("type") or "")
                        or "PartialParsing" in str(e)]
          print(f"SAST: {len(results)} finding(s), {len(errors)} error(s), "
                f"{len(parse_gaps)} PartialParsing.")
          for e in errors:
              print(f"  error: {e.get('type', '?')}: {str(e.get('message') or e)[:200]}")
          for r in results:
            sev = (r.get("extra") or {}).get("severity") or "?"
            rid = r.get("check_id") or "?"
            path = r.get("path") or "?"
            start = ((r.get("start") or {}).get("line")) or "?"
            msg = ((r.get("extra") or {}).get("message") or "").split("\n")[0][:160]
            print(f"  {sev:7} {path}:{start}  {rid}  {msg}")
          if parse_gaps:
              print("")
              print("FAIL: semgrep could not parse some files (PartialParsing).")
              print("A coverage gap that presents as a pass is worse than no scanner.")
              sys.exit(1)
          if errors and not parse_gaps:
              print("semgrep reported non-parse errors (advisory this phase).")
          print("OK: no PartialParsing gaps (findings are report-only).")
          PYEOF
