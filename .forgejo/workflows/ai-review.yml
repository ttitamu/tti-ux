# AI code review (plan Area F v2) — ADVISORY, changed-files only, via the TTI AI BFF.
#
# Calls the gateway's POST /v1/repos/{o}/{r}/pulls/{n}/reviews: a multi-model superPOD PANEL
# (Muse Glimmer 30B, Gemma 4 31B, Mistral Medium 3.5 128B, poolside Laguna S 2.1 — the gateway's
# REVIEW_PANEL default since 2026-09-30) independently reviews the diff, cross-examines each
# other's findings, and synthesizes ONE comment — with bounded, receipted
# Google-PSE web grounding when a reviewer requests verification. The debate
# logic lives in the GATEWAY on purpose: this vendored file stays a thin
# caller, so panel upgrades don't require re-seeding every repo.
# NEVER blocks: the job always exits 0 — the deterministic H2 baseline
# gate is the thing with teeth; this is a second pair of eyes, not a gate.
#
# Auth: the BFF call uses a dedicated ai-review bot PAT (secret AI_REVIEW_TOKEN),
# but is ATTRIBUTED to the PR author via X-TTI-Actor — so BFF usage telemetry
# shows who put the code up, executed-by the bot. Seeded per-repo by
# ai/seed-ai-review.sh (same idiom as security/seed-baseline.sh).
name: ai-review
on:
  pull_request:
    branches: ["**"]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: AI-Restricted gate (skip all AI on flagged repos)
        id: gate
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A repo carrying the "ai-restricted" topic is excluded from ALL AI.
          # Fail-closed: if the topic check itself errors, SKIP (treat as
          # restricted) rather than review something we couldn't clear.
          # Values reach the shell through env:, never expression-interpolated
          # into run: (Actions substitutes textually before bash parses; a
          # crafted github.repository of feat/$(id) is a valid git ref).
          T=$(curl -sf -H "Authorization: token $JOB_TOKEN" \
                "$SERVER_URL/api/v1/repos/$REPO/topics" || echo '{"topics":["ai-restricted"]}')
          if printf '%s' "$T" | grep -q '"ai-restricted"'; then
            echo "repo is ai-restricted — skipping AI review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticated checkout (private-repo safe)
        if: steps.gate.outputs.skip != 'true'
        # Ref names reach the shell through env:, never through ${{ }}
        # interpolation. Actions substitutes ${{ }} TEXTUALLY before bash
        # parses the line, and `$(...)`/backticks execute even inside double
        # quotes — so a branch literally named `feat/$(curl …|sh)` (a valid
        # git ref) would run on the runner. Env vars are not re-parsed.
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          JOB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          # Defensive: every file the later steps read starts absent, so a marker
          # left in a reused /tmp (a host-mode runner) can never be posted or obeyed.
          rm -f /tmp/pr.diff /tmp/pr.unreviewable /tmp/review.md /tmp/review.notice /tmp/review.posted
          git init -q
          git remote add origin "$SERVER_URL/$REPO"
          hdr="Authorization: basic $(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 | tr -d '\n')"
          # A head or base the forge will not serve is not a failed job (this
          # one is advisory and exits 0): say why, and the PR gets one line.
          if git -c http.extraheader="$hdr" fetch --depth=50 origin "$BASE_REF" "$HEAD_SHA" \
             && git checkout -q "$HEAD_SHA"; then
            git branch -f _base "origin/$BASE_REF" 2>/dev/null || true
          else
            echo "could not fetch this PR's head commit and base branch from the forge" > /tmp/pr.unreviewable
          fi

      - name: Compute changed-files diff (capped)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -eu
          [ -f /tmp/pr.unreviewable ] && { cat /tmp/pr.unreviewable; exit 0; }
          # A diff that could not be computed is said so, never passed on as an
          # empty one: an empty diff means "nothing to review" and posts nothing.
          if ! BASE=$(git merge-base _base HEAD 2>/dev/null || git rev-parse -q --verify HEAD~1); then
            echo "could not find where this PR's branch leaves its base branch" > /tmp/pr.unreviewable
          elif ! git diff --unified=3 "$BASE"...HEAD -- . > /tmp/pr.diff; then
            echo "git could not compute this PR's diff" > /tmp/pr.unreviewable
          fi
          [ -f /tmp/pr.unreviewable ] && { rm -f /tmp/pr.diff; cat /tmp/pr.unreviewable; exit 0; }
          # cap to stay within the panel's context budget (gateway re-caps too)
          head -c 100000 /tmp/pr.diff > /tmp/pr.capped && mv /tmp/pr.capped /tmp/pr.diff
          echo "diff bytes: $(wc -c < /tmp/pr.diff)"

      - name: Panel review via BFF (/v1/review)
        if: steps.gate.outputs.skip != 'true'
        env:
          BFF_TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
          BFF_URL: http://host.containers.internal:3950
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -eu
          if [ -f /tmp/pr.unreviewable ]; then
            # One line saying why, not a review: no verdict and no panel footer.
            printf '_The AI panel did not review this change: %s. It will review the next push._\n' \
              "$(cat /tmp/pr.unreviewable)" > /tmp/review.md
            : > /tmp/review.notice
            exit 0
          fi
          # An empty diff writes NO review body. It used to write a newline,
          # which passed the post step's non-empty test and put a header-only
          # comment on every PR merged before its review job ran
          # (nis/forgejo-stack#293).
          if ! grep -q '[^[:space:]]' /tmp/pr.diff 2>/dev/null; then
            echo "empty diff — nothing to review (the head adds nothing to the base branch; merged before this job ran?) — posting nothing"
            : > /tmp/review.md
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          # Passing "pr" lets the gateway post a REAL Forgejo review with
          # inline comments at file:line (Area I2) — the human ↔ panel board
          # and native threads hang off that. If it posts, we skip the classic
          # single comment below; otherwise we fall back to it.
          body = {"context": "PR title: " + os.environ.get("PR_TITLE", ""),
                  "diff": open("/tmp/pr.diff").read()}
          # Forgejo-shaped route (ADR-0002): repo and PR live in the PATH and the
          # gateway checks the caller can see that repo before it reads the diff.
          req = urllib.request.Request(os.environ["BFF_URL"] + "/v1/repos/" + os.environ["REPO"]
                  + "/pulls/" + str(int(os.environ.get("PR_NUMBER") or 0)) + "/reviews",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json",
                           "Authorization":"token "+os.environ["BFF_TOKEN"],
                           "X-TTI-Actor":os.environ["ACTOR"]})
          out = None
          fail = None
          for attempt in range(3):
              try:
                  # Retry ONLY 429 quota. 502/503 are inconclusive (a panel
                  # model's timeout or over-limit) — retrying burns ~4.5 min
                  # and will not recover; stop, but fall THROUGH to the
                  # advisory comment below (AI review is advisory — a panel
                  # outage must not red the PR).
                  with urllib.request.urlopen(req, timeout=600) as r:
                      out = json.load(r)
                  break
              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", "replace")
                  print(f"attempt {attempt+1} failed: HTTP {e.code}")
                  if e.code != 429:
                      fail = f"panel HTTP {e.code}: {detail[:300]}"
                      break
                  if attempt < 2:
                      import time; time.sleep(90)
              except Exception as e:
                  print(f"attempt {attempt+1} failed: {e}")
                  if attempt < 2:
                      import time; time.sleep(90)
          try:
              if out is None:
                  raise RuntimeError(fail or "panel unavailable after 3 attempts")
              # I2: when the gateway already posted a native Forgejo review
              # (inline comments + findings board), DON'T also post the classic
              # single comment — leave a sentinel so the next step skips.
              if out.get("posted"):
                  open("/tmp/review.posted","w").write("1")
                  print("native review posted — skipping classic comment")
              md = out["markdown"] + "\n\n<sub>⚑ " + out.get("receipt", "") + "</sub>"
              # Debate transparency: collapsible how-we-got-here digest + a
              # link to the full transcript (round outputs, verdicts, web
              # results, model reasoning) — ACL-gated to repo visibility.
              if out.get("digest"):
                  md += "\n\n" + out["digest"]
              if out.get("review_id"):
                  md += ("\n\n<sub>Full transcript: " + os.environ["SERVER_URL"]
                         + "/-/ai/v1/reviews/" + out["review_id"] + "</sub>")
          except Exception as e:
              md = ("_The AI panel couldn't review this change right now "
                    "(it will review the next push). Details for admins: "
                    f"{e}_")
              # A notice, not a review: the post step leaves off the footer
              # that says the panel reviewed it.
              open("/tmp/review.notice", "w").close()
          open("/tmp/review.md","w").write(md)
          print("review chars:", len(md))
          PY

      - name: Post review comment
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          # Visible text or nothing: a body of only whitespace is the header-
          # and-footer blank comment that landed on nis/forgejo-stack#293.
          grep -q '[^[:space:]]' /tmp/review.md 2>/dev/null || { echo "no review body — nothing to post"; exit 0; }
          # I2: the gateway already posted a native review with inline
          # comments + the findings board — don't double-post.
          [ -f /tmp/review.posted ] && { echo "native review posted; no classic comment"; exit 0; }
          # No emoji — the ai-review-bot's maroon Lucide avatar (branding/bot-avatars.py)
          # marks the comment, keeping the house symbology consistent.
          # A notice (the panel did not review this change) gets no footer:
          # the footer says the panel reviewed it.
          BODY=$(python3 -c "import json,os;print(json.dumps({'body':'### AI review · advisory\n\n'+open('/tmp/review.md').read()+('' if os.path.exists('/tmp/review.notice') else '\n\n<sub>A panel of superPOD models reviewed this independently and cross-examined each other; only what survived is shown. Advisory — never a merge gate.</sub>')}))")
          # Post AS ai-review-bot (named identity + maroon avatar in the feed,
          # instead of the anonymous actions "Ghost"); fall back to the job
          # token if the bot PAT lacks issue-write on this repo.
          post() { printf '%s' "$BODY" | curl -sf -X POST \
            -H "Authorization: token $1" -H "Content-Type: application/json" \
            --data @- \
            "$SERVER_URL/api/v1/repos/$REPO/issues/$PR_NUMBER/comments" \
            -o /dev/null -w "comment posted ($2): %{http_code}\n"; }
          post "$BOT_TOKEN" "ai-review-bot" || post "$GH_TOKEN" "actions token" || echo "comment post failed (non-fatal)"
