# Publish @tti/ux to the Forgejo npm registry on every tag push.
#
# Ported to the A1 Ubuntu runner (runs-on: ubuntu-latest, 2026-06-23). The TTI
# runner image (A1.0) pre-bakes node 20 + npm + trivy, so this is now plain
# standard-action steps — no manual git checkout, no Bun, no per-job tool
# downloads (the host-mode v9 dance this replaces is in git history).
name: publish
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # trivy is baked into the runner image — just run it.
      - name: Scan with Trivy (fail on HIGH/CRITICAL)
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 .

      - name: Generate SBOM (CycloneDX)
        run: trivy fs --format cyclonedx --output sbom.cdx.json .

      - name: Build
        run: npm run build

      - name: Configure Forgejo npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Registry host matches package.json publishConfig so npm publish is
          # consistent. host.containers.internal:3939 is reachable from the job
          # container (verified) and is the address baked into the package.
          cat > .npmrc <<EOF
          @tti:registry=http://host.containers.internal:3939/api/packages/tti/npm/
          //host.containers.internal:3939/api/packages/tti/npm/:_authToken=${NPM_TOKEN}
          EOF

      - name: Publish
        run: npm publish

      - name: Upload SBOM to Forgejo generic registry
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          TAG="${{ github.ref_name }}"
          curl -sf -X PUT \
            --header "Authorization: token ${NPM_TOKEN}" \
            --upload-file sbom.cdx.json \
            "http://host.containers.internal:3939/api/packages/tti/generic/tti-ux-sbom/${TAG}/sbom.cdx.json"
