# Publish @tti/ux to the Forgejo npm registry on every tag push.
#
# Ported to the A1 Ubuntu runner (runs-on: ubuntu-latest, 2026-06-23). The TTI
# runner image (A1.0) pre-bakes node 20 + npm + trivy, so this is now plain
# standard-action steps — no manual git checkout, no Bun, no per-job tool
# downloads (the host-mode v9 dance this replaces is in git history).
name: publish
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # trivy is baked into the runner image — just run it.
      - name: Scan with Trivy (fail on HIGH/CRITICAL)
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 .

      - name: Generate SBOM (CycloneDX)
        run: trivy fs --format cyclonedx --output sbom.cdx.json .

      - name: Build
        run: npm run build

      - name: Configure Forgejo npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Registry host matches package.json publishConfig so npm publish is
          # consistent. host.containers.internal:3939 is reachable from the job
          # container (verified) and is the address baked into the package.
          cat > .npmrc <<EOF
          @tti:registry=http://host.containers.internal:3939/api/packages/tti/npm/
          //host.containers.internal:3939/api/packages/tti/npm/:_authToken=${NPM_TOKEN}
          EOF

      - name: Publish
        run: npm publish

      - name: Upload SBOM to Forgejo generic registry
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          TAG="${{ github.ref_name }}"
          curl -sf -X PUT \
            --header "Authorization: token ${NPM_TOKEN}" \
            --upload-file sbom.cdx.json \
            "http://host.containers.internal:3939/api/packages/tti/generic/tti-ux-sbom/${TAG}/sbom.cdx.json"

      # A3 supply-chain signing (key-based; cosign 3.x is baked into the runner
      # image). Keyless/Fulcio is NOT possible here — Forgejo Actions issues no
      # job OIDC token, and Fulcio only trusts specific CI issuers. The private
      # key lives ONLY in repo secrets (COSIGN_KEY, password-encrypted; passphrase
      # in COSIGN_PASSWORD); the public key is committed as cosign.pub.
      # cosign 3.x gotchas (hit live 2026-07-03): --output-signature is GONE —
      # signatures ship as sigstore BUNDLES (--bundle); and we skip the public
      # Rekor tlog (--tlog-upload=false on sign, --insecure-ignore-tlog on
      # verify) because this is a private forge with no transparency-log infra.
      # Verify any artifact offline:
      #   cosign verify-blob --key cosign.pub --bundle <file>.bundle \
      #     --insecure-ignore-tlog=true <file>
      - name: Sign artifacts (cosign)
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          TAG="${{ github.ref_name }}"
          npm pack --pack-destination /tmp >/dev/null
          TARBALL=$(ls /tmp/tti-ux-*.tgz)
          cp "$TARBALL" package.tgz
          cosign sign-blob --yes --tlog-upload=false --key env://COSIGN_KEY \
            --bundle sbom.cdx.json.bundle sbom.cdx.json
          cosign sign-blob --yes --tlog-upload=false --key env://COSIGN_KEY \
            --bundle package.tgz.bundle package.tgz
          for f in sbom.cdx.json.bundle package.tgz.bundle package.tgz; do
            curl -sf -X PUT \
              --header "Authorization: token ${NPM_TOKEN}" \
              --upload-file "$f" \
              "http://host.containers.internal:3939/api/packages/tti/generic/tti-ux-sbom/${TAG}/${f}"
          done
          echo "signed + bundles published for ${TAG}"
