# Publish @tti/ux to the Forgejo npm registry on every tag push.
# Runs on the phase-1 host-mode runner (Forgejo Runner v9.1.1 — runs as
# UID 1000, no apk-add root, no /usr/local/bin write). Tools are either
# (a) already in the image (bash/git/tar/wget) or (b) downloaded into
# the workspace by setup-node / direct download to ~/.local/bin.
# A1 will replace this with a full Ubuntu runner where these are pre-baked.
name: publish
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: host
    steps:
      # Manual checkout — Forgejo Runner v9 host runner has no node, and
      # actions/checkout is a JS action that needs node to execute. Working
      # around the chicken-and-egg with raw git (already in the image).
      - name: Manual checkout (no JS-actions on this host runner)
        run: |
          set -eu
          git init -q
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      # Install Bun — it's a Node-compatible runtime (bun publish ≈ npm publish)
      # with proper musl arm64 builds. Official Node ships only glibc binaries
      # and unofficial-builds has no linux-arm64-musl, so Bun is the practical
      # choice on Alpine-on-Apple-Silicon until A1 (Ubuntu runner) lands.
      - name: Install Bun
        run: |
          set -eux
          mkdir -p "$HOME/.local/bin"
          ARCH=$(uname -m | sed 's/aarch64/aarch64/;s/arm64/aarch64/;s/x86_64/x64/')
          BUN_URL="https://github.com/oven-sh/bun/releases/latest/download/bun-linux-${ARCH}-musl.zip"
          wget -qO /tmp/bun.zip "$BUN_URL"
          unzip -q -o /tmp/bun.zip -d /tmp/bun-extract
          mv /tmp/bun-extract/bun-linux-${ARCH}-musl/bun "$HOME/.local/bin/bun"
          chmod +x "$HOME/.local/bin/bun"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bun" --version

      - name: Install Trivy
        run: |
          set -eux
          mkdir -p "$HOME/.local/bin"
          case "$(uname -m)" in
            aarch64|arm64) TRIVY_ARCH=ARM64 ;;
            x86_64)        TRIVY_ARCH=64bit ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          TRIVY_VERSION=0.70.0
          wget -qO- "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-${TRIVY_ARCH}.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trivy

      - name: Scan with Trivy
        run: "$HOME/.local/bin/trivy fs --severity HIGH,CRITICAL --exit-code 1 ."

      - name: Generate SBOM (CycloneDX)
        run: "$HOME/.local/bin/trivy fs --format cyclonedx --output sbom.cdx.json ."

      - name: Build
        # The "build" script in package.json is pure shell — `bun run` invokes
        # it the same way `npm run` would.
        run: "$HOME/.local/bin/bun run build"

      - name: Configure Forgejo npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cat > .npmrc <<EOF
          @tti:registry=http://host.containers.internal:3939/api/packages/tti/npm/
          //host.containers.internal:3939/api/packages/tti/npm/:_authToken=${NPM_TOKEN}
          EOF

      - name: Publish
        # `bun publish` reads package.json + .npmrc the same as npm publish.
        run: "$HOME/.local/bin/bun publish --access restricted"

      - name: Upload SBOM to Forgejo generic registry
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          TAG="${{ github.ref_name }}"
          wget -q --header="Authorization: token ${NPM_TOKEN}" \
            --method=PUT --body-file=sbom.cdx.json \
            "http://host.containers.internal:3939/api/packages/tti/generic/tti-ux-sbom/${TAG}/sbom.cdx.json" \
            -O /dev/null
