# Publish @tti/tti-ux to the forge's npm registry (scope @tti, owner tti):
#   https://code.tti.tamu.edu/api/packages/tti/npm/
#
# Forgejo (code.tti.tamu.edu) is the canonical package source for tux; the
# GitHub repo is a mirror for the Pages deploy of ux.tti.tamu.edu. Consumers
# add one line to their .npmrc (no token: the tti org is public, so the
# registry reads anonymously):
#   @tti:registry=https://code.tti.tamu.edu/api/packages/tti/npm/
#
# Triggers:
#   - a pushed tag v<version> publishes that tag (the release commit sets
#     package.json's version; the tag must match it);
#   - workflow_dispatch with an EXISTING tag publishes it from here, with this
#     workflow's tooling. That is how tags cut before this workflow existed are
#     backfilled (v1.6.0, v1.7.0, the prereleases of untagged trees that
#     consumers pin). Publishing a version that is already there is a no-op.
#
# What gets published, and the checks, are in scripts/publish-registry.mjs:
# the layer, then (a step of its own) the React ports @tti/tti-ux-react when
# packages/react is version-locked to the tag. Tag the release commit and let
# this publish both; a hand `npm publish` of the same version races the React
# step (v3.2.1, run 11312: the version appeared between its check and its
# upload, so the step failed although both packages were out).
# The tooling is checked out from this run's own commit and the tag into a
# separate directory, so a backfilled tag is packed as-tagged but published
# with today's rules.
#
# Auth: secret PACKAGES_PUBLISH_TOKEN, a write:package token of the Entra
# service account svc-tti-packages, which reaches the registry through the tti
# team "package-publishers" (Packages: write, nothing else), with this repo
# added to the team: Forgejo also wants Packages-write on the repository a
# package's repository.url names (2.x/3.x name this one, and were refused with
# 403 "no permission to upload this package" until it was added; v1 names
# GitHub, so it published without). The automatic job
# token can't do this: Forgejo v17 grants an Actions token only READ on an
# org's packages (services/packages/perm.go, "TODO: ActionUser permission
# check"). Never a person's token, never a local account.
#
# The job publishes to the PUBLIC registry URL, over TLS: a Linux job reaches
# it (run 11216 of A-Guevara/macos-runner-smoke, 2026-10-16), and that is the
# URL every consumer's lockfile records.
#
# House idiom: values reach the shell through env:, never ${{ }} inside run:.
name: publish-package
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to publish, e.g. v1.7.0"
        required: true
        type: string

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY: https://code.tti.tamu.edu/api/packages/tti/npm/
    steps:
      - name: Check out the tooling and the tag
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          JOB_TOKEN: ${{ github.token }}
          TOOLING_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_dispatch ]; then TAG=$INPUT_TAG; else TAG=$PUSHED_TAG; fi
          # Validate before the value goes anywhere (GITHUB_ENV, a git ref). The
          # character check comes first: grep matches line by line, so a value
          # with a newline in it could otherwise pass on its first line alone.
          case "$TAG" in
            "" | *[!0-9A-Za-z.-]*) echo "::error::not a release tag (unexpected characters)"; exit 1 ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'; then
            echo "::error::not a release tag: $TAG"; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # The job token in a header (never in remote config); works on a private repo too.
          hdr="Authorization: basic $(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 | tr -d '\n')"
          for d in tooling pkg; do git init -q "$d"; git -C "$d" remote add origin "$SERVER_URL/$REPO"; done
          git -C tooling -c http.extraheader="$hdr" fetch -q --depth=1 origin "$TOOLING_SHA"
          git -C tooling checkout -q FETCH_HEAD
          git -C pkg -c http.extraheader="$hdr" fetch -q --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git -C pkg checkout -q "refs/tags/$TAG"
          echo "tag $TAG is $(git -C pkg rev-parse HEAD); tooling at $(git -C tooling rev-parse HEAD)"
          node --version; npm --version

      - name: Publish @tti/tti-ux
        env:
          PUBLISH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        run: |
          set -eu
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "::error::secret PACKAGES_PUBLISH_TOKEN is missing: the write:package token of svc-tti-packages (see this file's header)"
            exit 1
          fi
          node tooling/scripts/publish-registry.mjs --package layer --tag "$TAG" --pkg-dir pkg --registry "$REGISTRY"

      # The React ports ride the same tag only when version-locked to it (the
      # script says "layer only" otherwise). After the layer, and a step of
      # their own: a React build failure is red here with the layer already out,
      # and re-running the tag publishes only what is missing.
      - name: Publish @tti/tti-ux-react (when version-locked)
        env:
          PUBLISH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        run: |
          set -eu
          node tooling/scripts/publish-registry.mjs --package react --tag "$TAG" --pkg-dir pkg --registry "$REGISTRY"
