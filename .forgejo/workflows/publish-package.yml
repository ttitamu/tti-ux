# Publish @tti/tti-ux to the Forgejo npm registry on every version tag.
#
# Forgejo (code.tti.tamu.edu) is the CANONICAL package source for tux;
# the GitHub repo is a mirror whose only job is the GitHub Pages deploy
# of ux.tti.tamu.edu. Consumers install via the @tti scope:
#   @tti:registry=https://code.tti.tamu.edu/api/packages/tti/npm/
#
# No build step on purpose: package.json "files" lists committed
# content (app/, kit/, scripts/, docs/, …), so `npm publish` packs the
# repo as-tagged. Generated artifacts (kit/css, kit/scss) are committed
# by `npm run build:kit` before release — publishing never regenerates.
#
# Auth: REQUIRES the repo secret PACKAGE_TOKEN — a user access token
# with package:write. The workflow's automatic job token was tried
# first (v2.0.0 run 523) and the registry rejected it with ENEEDAUTH,
# so the job-token fallback exists only to produce a clear error
# message, not as a working path. v2.0.0 itself was published
# manually with an owner token; every later tag publishes here.
# House security idiom applies: values reach the shell through env:,
# never ${{ }} inside run:.
name: publish-package
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticated checkout (tag)
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          JOB_TOKEN: ${{ github.token }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -eu
          git init -q .
          AUTH_URL=$(printf '%s' "$SERVER_URL" | sed "s#https://#https://oauth2:${JOB_TOKEN}@#")
          git remote add origin "$AUTH_URL/$REPO.git"
          git fetch -q --depth 1 origin "refs/tags/$TAG_REF:refs/tags/$TAG_REF"
          git checkout -q "refs/tags/$TAG_REF"

      - name: Verify tag matches package.json version
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -eu
          PKG_VERSION=$(node -p "require('./package.json').version" 2>/dev/null \
            || sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)
          if [ "v$PKG_VERSION" != "$TAG_REF" ]; then
            echo "::error::tag $TAG_REF != package.json version $PKG_VERSION — retag or bump before publishing"
            exit 1
          fi

      - name: Publish to the Forgejo npm registry
        env:
          SERVER_URL: ${{ github.server_url }}
          JOB_TOKEN: ${{ github.token }}
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          set -eu
          command -v npm >/dev/null 2>&1 || {
            echo "::error::npm not on runner image — install Node on the A1 runner or switch runs-on"; exit 1; }
          if [ -z "${PACKAGE_TOKEN:-}" ]; then
            echo "::error::PACKAGE_TOKEN secret missing. The automatic job token cannot write packages (ENEEDAUTH, run 523). Add a repo Actions secret PACKAGE_TOKEN containing a user token with package:write, then re-run."
            exit 1
          fi
          # On the runner, github.server_url resolves to the INTERNAL
          # address (host.containers.internal:PORT), not the public
          # hostname — publish through it, and write auth for both
          # hosts so publishConfig's public URL also resolves.
          REG="$SERVER_URL/api/packages/tti/npm/"
          RUNNER_HOST=$(printf '%s' "$SERVER_URL" | sed 's#^https\{0,1\}://##')
          {
            printf '@tti:registry=%s\n' "$REG"
            printf '//%s/api/packages/tti/npm/:_authToken=%s\n' "$RUNNER_HOST" "$PACKAGE_TOKEN"
            printf '//code.tti.tamu.edu/api/packages/tti/npm/:_authToken=%s\n' "$PACKAGE_TOKEN"
          } > "$HOME/.npmrc"
          # --registry beats publishConfig (which pins the public URL,
          # unreachable as-such from inside the runner network).
          # --ignore-scripts: postinstall (nuxt prepare) is for
          # consumers, not the publish pack.
          npm publish --ignore-scripts --registry "$REG"
          echo "published @tti/tti-ux@${GITHUB_REF_NAME#v} via $REG"
