# boards-rollup — event-driven epic roll-up (Area G2).
#
# Re-homes boards/rollup.sh into a Forgejo Action so an epic's roll-up block
# refreshes within seconds of a child issue changing, instead of waiting for the
# 06:00 boards.timer (G1). Same logic, same source of truth: it runs the *exact*
# boards/_boards.py that the host-side timer runs — install-g2.sh vendors a copy
# to .forgejo/boards/_boards.py in this repo, so there is no forked rollup code.
#
# Requires the A1 Ubuntu runner (runs-on: ubuntu-latest) — the retired v9 Alpine
# runner had no python3. Installed by: boards/install-g2.sh <org> [--repo NAME].
# Generic by design — derives org/repo from the event, so the same file drops
# into any repo unchanged.
name: boards-rollup
on:
  issues:
    # The events that can change a roll-up: membership (open/close/reopen),
    # the `Epic: #n` body marker (edited), and points/state labels.
    types: [opened, edited, closed, reopened, labeled, unlabeled]

# One roll-up at a time per repo; a newer event supersedes an in-flight run
# (rollup always recomputes from current state, so the latest run wins).
concurrency:
  group: boards-rollup-${{ github.repository }}
  cancel-in-progress: true

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Roll up epics in this repo
        env:
          # Forge address reachable from the job container. Laptop default is
          # host.containers.internal:3939 (the same address publish.yml uses and
          # which is verified-reachable). Override per-env with a repo/org
          # Actions variable TTI_FORGE_URL (https://code.tti.tamu.edu on nis and
          # tti since 2026-10-16). Never FORGEJO_URL: Forgejo refuses variable
          # names starting FORGEJO_, GITEA_ or GITHUB_ ("invalid secret name"),
          # so this override could never be set and every run used the host
          # address, which only the forge VM's runner answers.
          FORGEJO_URL: ${{ vars.TTI_FORGE_URL || 'http://host.containers.internal:3939' }}
          # The auto-injected token carries issues:write on this repo — enough to
          # PATCH the epic body. (It lacks package-write, which is why publish.yml
          # mints a separate PAT; roll-ups don't touch packages.)
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Values reach the shell through env:, never expression-interpolated
          # into run: (Actions substitutes textually before bash parses — the
          # ai-review.yml RCE class; latent here while Forgejo restricts
          # owner/repo names to AlphaDashDot, fixed for the invariant).
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python3 .forgejo/boards/_boards.py rollup \
            "$OWNER" \
            --repo "$REPO_NAME" \
            --apply
