<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" role="img" aria-label="Project Lifecycle Management and Training Series Illustration">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#500000" />
      <stop offset="50%" stop-color="#3c0000" />
      <stop offset="100%" stop-color="#240000" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD100" />
      <stop offset="100%" stop-color="#D4A017" />
    </linearGradient>

    <!-- Teal Accent Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <!-- Ambient Glow Elements -->
  <circle cx="200" cy="180" r="300" fill="#700000" filter="blur(80px)" opacity="0.6" />
  <circle cx="1400" cy="700" r="350" fill="#300000" filter="blur(90px)" opacity="0.8" />
  <circle cx="800" cy="450" r="220" fill="#FFD100" filter="blur(140px)" opacity="0.12" />

  <!-- Top Institutional Brand Header -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="8" height="36" fill="url(#goldGrad)" rx="2" />
    <text x="24" y="24" fill="#FFD100" font-family="-apple-system, BlinkMacSystemFont, 'Public Sans', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-transform="uppercase">RESEARCH OPERATIONS &amp; WORKFORCE DEVELOPMENT</text>
    <text x="24" y="70" fill="#FFFFFF" font-family="'Oswald', Impact, sans-serif" font-size="44" font-weight="700" letter-spacing="1.5">PROJECT LIFECYCLE MANAGEMENT FRAMEWORK</text>
    <text x="24" y="105" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Work Sans', sans-serif" font-size="18" opacity="0.85">Integrated milestone tracking, workload forecasting, and role-based training modules</text>
  </g>

  <!-- Workflow Pipeline Flow (4 Stage Cards) -->
  <g transform="translate(100, 260)">
    <!-- Stage Connecting Line -->
    <path d="M 160 180 L 1240 180" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3" stroke-dasharray="8 8" />

    <!-- Stage 1: Initiation -->
    <g transform="translate(0, 40)">
      <rect width="320" height="420" rx="12" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />
      <rect x="0" y="0" width="320" height="6" fill="#38BDF8" rx="3" />
      <circle cx="160" cy="140" r="32" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="2" />
      <text x="160" y="147" fill="#38BDF8" font-family="'Oswald', sans-serif" font-size="20" font-weight="700" text-anchor="middle">01</text>
      
      <text x="30" y="45" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PHASE I</text>
      <text x="30" y="80" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-size="22" font-weight="600">SCOPING &amp; CHARTER</text>
      
      <g transform="translate(30, 210)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">Work Breakdown Structure</text>
      </g>
      <g transform="translate(30, 266)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">Sponsor Deliverables</text>
      </g>
      <g transform="translate(30, 322)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">Compliance Review</text>
      </g>
    </g>

    <!-- Stage 2: Resource Allocation -->
    <g transform="translate(360, 40)">
      <rect width="320" height="420" rx="12" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />
      <rect x="0" y="0" width="320" height="6" fill="#FFD100" rx="3" />
      <circle cx="160" cy="140" r="32" fill="#FFD100" fill-opacity="0.2" stroke="#FFD100" stroke-width="2" />
      <text x="160" y="147" fill="#FFD100" font-family="'Oswald', sans-serif" font-size="20" font-weight="700" text-anchor="middle">02</text>
      
      <text x="30" y="45" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PHASE II</text>
      <text x="30" y="80" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-size="22" font-weight="600">CAPACITY PLANNING</text>
      
      <g transform="translate(30, 210)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">FTE Effort Forecasting</text>
      </g>
      <g transform="translate(30, 266)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">Task Code Alignment</text>
      </g>
      <g transform="translate(30, 322)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">Budget Burn Variance</text>
      </g>
    </g>

    <!-- Stage 3: Execution & Milestones -->
    <g transform="translate(720, 40)">
      <rect width="320" height="420" rx="12" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />
      <rect x="0" y="0" width="320" height="6" fill="#4ADE80" rx="3" />
      <circle cx="160" cy="140" r="32" fill="#4ADE80" fill-opacity="0.2" stroke="#4ADE80" stroke-width="2" />
      <text x="160" y="147" fill="#4ADE80" font-family="'Oswald', sans-serif" font-size="20" font-weight="700" text-anchor="middle">03</text>
      
      <text x="30" y="45" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PHASE III</text>
      <text x="30" y="80" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-size="22" font-weight="600">MILESTONE TRACKING</text>
      
      <g transform="translate(30, 210)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">Monthly Status Briefings</text>
      </g>
      <g transform="translate(30, 266)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">Risk Log Mitigation</text>
      </g>
      <g transform="translate(30, 322)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">Quarterly Progress Audit</text>
      </g>
    </g>

    <!-- Stage 4: Synthesis & Closeout -->
    <g transform="translate(1080, 40)">
      <rect width="320" height="420" rx="12" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />
      <rect x="0" y="0" width="320" height="6" fill="#A78BFA" rx="3" />
      <circle cx="160" cy="140" r="32" fill="#A78BFA" fill-opacity="0.2" stroke="#A78BFA" stroke-width="2" />
      <text x="160" y="147" fill="#A78BFA" font-family="'Oswald', sans-serif" font-size="20" font-weight="700" text-anchor="middle">04</text>
      
      <text x="30" y="45" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PHASE IV</text>
      <text x="30" y="80" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-size="22" font-weight="600">DELIVERY &amp; CLOSEOUT</text>
      
      <g transform="translate(30, 210)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">Technical Report QA</text>
      </g>
      <g transform="translate(30, 266)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">Data Repository Archival</text>
      </g>
      <g transform="translate(30, 322)">
        <rect width="260" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="16" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="13">Final Institutional Close</text>
      </g>
    </g>
  </g>

  <!-- Bottom Badges / Metrics Strip -->
  <g transform="translate(100, 780)">
    <rect width="1400" height="60" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <text x="40" y="36" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-size="16" font-weight="600" letter-spacing="1">ROLE-BASED TRACKS:</text>
    <text x="230" y="36" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="14">Principal Investigators</text>
    <circle cx="410" cy="31" r="3" fill="#FFD100" />
    <text x="430" y="36" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="14">Project Managers</text>
    <circle cx="580" cy="31" r="3" fill="#FFD100" />
    <text x="600" y="36" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="14">Division Leadership</text>
    <circle cx="760" cy="31" r="3" fill="#FFD100" />
    <text x="780" y="36" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="14">Research Administration Specialists</text>
    <text x="1360" y="36" fill="#FFD100" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="end">4 MODULE WORKSHOP SERIES</text>
  </g>
</svg>
