<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" fill="none">
  <rect id="TUX / TuxBadge Sheet" width="760" height="200" rx="8" fill="#FFFFFF" stroke="#E7E6E6"/>
